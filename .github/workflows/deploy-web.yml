name: Build and deploy web game

on:
  push:
    branches: [main]
    paths:
      - "my-first-game/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache Godot downloads
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/charms-seeker-godot
          key: godot-4.7.2-web-export

      - name: Download Godot 4.7.2 and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/charms-seeker-godot
          wget -q --show-progress -O ~/.cache/charms-seeker-godot/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          wget -q --show-progress -O ~/.cache/charms-seeker-godot/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

      - name: Install Godot and templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates" ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q ~/.cache/charms-seeker-godot/godot.zip -d "$RUNNER_TEMP/godot"
          unzip -q ~/.cache/charms-seeker-godot/templates.tpz -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." ~/.local/share/godot/export_templates/4.7.2.stable/
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Export web game
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path my-first-game --export-release Web ../build/web/index.html
          test -s build/web/index.html

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

